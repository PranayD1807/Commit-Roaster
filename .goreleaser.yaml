version: 2

project_name: commit-roaster

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

brews:
  - name: commit-roaster
    repository:
      owner: PranayD1807
      name: homebrew-tap     
    description: "A CLI tool that roasts your terrible git commit messages."
    homepage: "https://github.com/PranayD1807/Commit-Roaster"
