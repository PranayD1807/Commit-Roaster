version: 2

project_name: commit-roaster

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/PranayD1807/Commit-Roaster/cmd.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

brews:
  # Stable formula — only published on full releases (no pre-release tag)
  - name: commit-roaster
    skip_upload: "{{ if .Prerelease }}true{{ end }}"
    repository:
      owner: PranayD1807
      name: homebrew-tap
    description: "A CLI tool that roasts your terrible git commit messages."
    homepage: "https://github.com/PranayD1807/Commit-Roaster"

  # Beta formula — only published on pre-release tags (e.g. v2.0.0-beta.1)
  - name: commit-roaster-beta
    skip_upload: "{{ if not .Prerelease }}true{{ end }}"
    repository:
      owner: PranayD1807
      name: homebrew-tap
    description: "commit-roaster beta — may be unstable."
    homepage: "https://github.com/PranayD1807/Commit-Roaster"
