name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Ensure Local Git Config Isolation
      run: git config --global --add safe.directory "*"

    - name: Run Unit Tests
      run: go test -v ./...

  integration-tests:
    name: Integration Tests (Gemini)
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run Integration Tests
      if: ${{ secrets.GEMINI_KEY != '' }}
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      # Write the secret into .env so geminiKey() can find it, then run tests
      run: |
        echo "GEMINI_KEY=${GEMINI_KEY}" > .env
        go test -v -tags integration ./tests/ -run TestGemini -timeout 120s
